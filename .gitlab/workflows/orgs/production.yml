####################################################
# Production Org Jobs
# All deployment jobs for the production environment.
# Set PRODUCTION_ORG_URL and the PRODUCTION_JWT_* / PRODUCTION_USERNAME / PRODUCTION_INSTANCE_URL variables in GitLab.
####################################################

####################################################
# Org credentials, defined once and shared by every job below.
# .prd-auth: credentials only (also used by sandboxRefresh and packageBackfillPrd).
# .prd-org:  credentials + deploy lock + environment URL for jobs that change the org.
####################################################
.prd-auth:
  variables:
    AUTH_ALIAS: PRODUCTION
    AUTH_CLIENT_ID: $PRODUCTION_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $PRODUCTION_JWT_KEY
    AUTH_USERNAME: $PRODUCTION_USERNAME
    AUTH_INSTANCE_URL: $PRODUCTION_INSTANCE_URL

.prd-org:
  extends: .prd-auth
  resource_group: production
  environment:
    url: $PRODUCTION_ORG_URL

test:unit:prd:
  extends: [.test-unit, .prd-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: always

test:postrun:prd:
  extends: [.test-postrun, .prd-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: delayed
      start_in: 90 minutes
  needs: ["test:unit:prd"]

test:predeploy:prd:
  extends: [.validate-metadata, .prd-org]
  stage: test
  rules:
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: manual
  # Manual jobs default to allow_failure: true; keep validation failures blocking.
  allow_failure: false
  environment:
    name: validate-production

deploy:prd:
  extends: [.deploy-metadata, .prd-org]
  stage: deploy
  rules:
    - if: $PRODUCTION_DISABLED
      when: never
    # packageBackfillPrd commits retrieved production metadata to the default branch
    # without ci.skip (so prodBackfill still merges it into the sandbox branches);
    # the metadata already came from production, so don't deploy it back.
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'push'
      when: always
  environment:
    name: production

destroy:prd:
  extends: [.delete-metadata, .prd-org]
  stage: destroy
  rules:
    - if: $PRODUCTION_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  environment:
    name: production
