####################################################
# Dev Org Jobs
# All deployment jobs for the development (DEV) environment.
# Set DEV_ORG_URL and the DEV_JWT_* / DEV_USERNAME / DEV_INSTANCE_URL variables in GitLab.
####################################################

test:unit:dev:
  extends: .test-unit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'develop'
      when: always
    - when: never
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL

test:postrun:dev:
  extends: .test-postrun
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'develop'
      when: delayed
      start_in: 90 minutes
    - when: never
  needs: ["test:unit:dev"]
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL

test:predeploy:dev:
  image: $CI_REGISTRY_IMAGE:$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  extends: .validate-metadata
  stage: test
  resource_group: develop
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: manual
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: validate-dev
    url: $DEV_ORG_URL

deploy:dev:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .deploy-metadata
  stage: deploy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'push'
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL

destroy:dev:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .delete-metadata
  stage: destroy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL

destroy:dev:push:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .delete-metadata-push
  stage: destroy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'push'
      when: always
  allow_failure: true
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL
