####################################################
# Dev Org Jobs
# All deployment jobs for the development (DEV) environment.
# Set DEV_ORG_URL and the DEV_JWT_* / DEV_USERNAME / DEV_INSTANCE_URL variables in GitLab.
# Org branching model: the develop branch maps to this org.
# Release branching model (BRANCHING_MODEL=release): MRs into release/* validate
# here, and pushes to release/* deploy here automatically. Release deploys diff
# from the merge-base with the default branch (DELTA_BASE_BRANCH), so each deploy
# carries the whole release. The release branch's first (creation) push is skipped.
####################################################

test:unit:dev:
  extends: .test-unit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'develop'
      when: always
    - when: never
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL

test:postrun:dev:
  extends: .test-postrun
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'develop'
      when: delayed
      start_in: 90 minutes
    - when: never
  needs: ["test:unit:dev"]
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL

test:predeploy:dev:
  extends: .validate-metadata
  stage: test
  resource_group: develop
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: manual
    - if: $BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//
      when: manual
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: validate-dev
    url: $DEV_ORG_URL

deploy:dev:
  extends: .deploy-metadata
  stage: deploy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: always
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL

destroy:dev:
  extends: .delete-metadata
  stage: destroy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL

destroy:dev:push:
  extends: .delete-metadata-push
  stage: destroy
  resource_group: develop
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'develop' && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: always
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  allow_failure: true
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL
  environment:
    name: dev
    url: $DEV_ORG_URL
