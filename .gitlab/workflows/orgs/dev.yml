####################################################
# Dev Org Jobs
# All deployment jobs for the development (DEV) environment.
# Set DEV_ORG_URL and the DEV_JWT_* / DEV_USERNAME / DEV_INSTANCE_URL variables in GitLab.
# Org branching model: the $DEV_BRANCH branch maps to this org.
# Release branching model (BRANCHING_MODEL=release): MRs into release/* validate
# here, and pushes to release/* deploy here automatically. Release deploys diff
# from the merge-base with the default branch (DELTA_BASE_BRANCH), so each deploy
# carries the whole release. The release branch's first (creation) push is skipped.
####################################################

####################################################
# Org credentials, defined once and shared by every job below.
# .dev-auth: credentials only (also used by packageBackfillSbxDevelop).
# .dev-org:  credentials + deploy lock + environment URL for jobs that change the org.
####################################################
.dev-auth:
  variables:
    AUTH_ALIAS: DEV
    AUTH_CLIENT_ID: $DEV_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $DEV_JWT_KEY
    AUTH_USERNAME: $DEV_USERNAME
    AUTH_INSTANCE_URL: $DEV_INSTANCE_URL

.dev-org:
  extends: .dev-auth
  resource_group: develop
  environment:
    url: $DEV_ORG_URL

test:unit:dev:
  extends: [.test-unit, .dev-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $DEV_BRANCH
      when: always

test:postrun:dev:
  extends: [.test-postrun, .dev-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $DEV_BRANCH
      when: delayed
      start_in: 90 minutes
  needs: ["test:unit:dev"]

test:predeploy:dev:
  extends: [.validate-metadata, .dev-org]
  stage: test
  rules:
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $DEV_BRANCH
      when: manual
    - if: $BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//
      when: manual
  # Manual jobs default to allow_failure: true; keep validation failures blocking.
  allow_failure: false
  environment:
    name: validate-dev

deploy:dev:
  extends: [.deploy-metadata, .dev-org]
  stage: deploy
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == $DEV_BRANCH && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: always
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  environment:
    name: dev

destroy:dev:
  extends: [.delete-metadata, .dev-org]
  stage: destroy
  rules:
    - if: $DEV_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == $DEV_BRANCH && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  environment:
    name: dev
