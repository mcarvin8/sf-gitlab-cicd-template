####################################################
# FullQA Org Jobs
# All deployment jobs for the full QA (sandbox) environment.
# Set FULLQA_ORG_URL and the FULLQA_JWT_* / FULLQA_USERNAME / FULLQA_INSTANCE_URL variables in GitLab.
####################################################

test:unit:fullqa:
  extends: .test-unit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'fullqa'
      when: always
    - when: never
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL

test:postrun:fullqa:
  extends: .test-postrun
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'fullqa'
      when: delayed
      start_in: 90 minutes
    - when: never
  needs: ["test:unit:fullqa"]
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL

test:predeploy:fullqa:
  image: $CI_REGISTRY_IMAGE:$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  extends: .validate-metadata
  stage: test
  resource_group: fullqa
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'fullqa'
      when: manual
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: validate-fullqa
    url: $FULLQA_ORG_URL

deploy:fullqa:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .deploy-metadata
  stage: deploy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'push'
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL

destroy:fullqa:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .delete-metadata
  stage: destroy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL

destroy:fullqa:push:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  extends: .delete-metadata-push
  stage: destroy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'push'
      when: always
  allow_failure: true
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL
