####################################################
# FullQA Org Jobs
# All deployment jobs for the full QA (sandbox) environment.
# Set FULLQA_ORG_URL and the FULLQA_JWT_* / FULLQA_USERNAME / FULLQA_INSTANCE_URL variables in GitLab.
# Org branching model: the $FULLQA_BRANCH branch maps to this org.
# Release branching model (BRANCHING_MODEL=release): MRs into release/* validate
# here, and pushes to release/* create a manual deploy job. deploy:fullqa
# needs deploy:dev, so it can only be played once the same commit is in Dev.
# Release deploys diff from the merge-base with the default branch
# (DELTA_BASE_BRANCH), so playing the latest pipeline deploys the whole release
# even if earlier pipelines were never played.
####################################################

####################################################
# Org credentials, defined once and shared by every job below.
# .fullqa-auth: credentials only (also used by packageBackfillSbxFullqa).
# .fullqa-org:  credentials + deploy lock + environment URL for jobs that change the org.
####################################################
.fullqa-auth:
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL

.fullqa-org:
  extends: .fullqa-auth
  resource_group: fullqa
  environment:
    url: $FULLQA_ORG_URL

test:unit:fullqa:
  extends: [.test-unit, .fullqa-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $FULLQA_BRANCH
      when: always

test:postrun:fullqa:
  extends: [.test-postrun, .fullqa-auth]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == $FULLQA_BRANCH
      when: delayed
      start_in: 90 minutes
  needs: ["test:unit:fullqa"]

test:predeploy:fullqa:
  extends: [.validate-metadata, .fullqa-org]
  stage: test
  rules:
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $FULLQA_BRANCH
      when: manual
    - if: $BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//
      when: manual
  # Manual jobs default to allow_failure: true; keep validation failures blocking.
  allow_failure: false
  environment:
    name: validate-fullqa

deploy:fullqa:
  extends: [.deploy-metadata, .fullqa-org]
  stage: deploy
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == $FULLQA_BRANCH && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: manual
      needs:
        - job: "deploy:dev"
          optional: true
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  # Manual (release model) jobs default to allow_failure: true; keep failures blocking.
  allow_failure: false
  environment:
    name: fullqa

destroy:fullqa:
  extends: [.delete-metadata, .fullqa-org]
  stage: destroy
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == $FULLQA_BRANCH && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  environment:
    name: fullqa
