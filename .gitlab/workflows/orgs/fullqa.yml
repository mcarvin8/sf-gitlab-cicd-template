####################################################
# FullQA Org Jobs
# All deployment jobs for the full QA (sandbox) environment.
# Set FULLQA_ORG_URL and the FULLQA_JWT_* / FULLQA_USERNAME / FULLQA_INSTANCE_URL variables in GitLab.
# Org branching model: the fullqa branch maps to this org.
# Release branching model (BRANCHING_MODEL=release): MRs into release/* validate
# here, and pushes to release/* create manual deploy/destroy jobs. deploy:fullqa
# needs deploy:dev, so it can only be played once the same commit is in Dev.
# Release deploys diff from the merge-base with the default branch
# (DELTA_BASE_BRANCH), so playing the latest pipeline deploys the whole release
# even if earlier pipelines were never played.
####################################################

test:unit:fullqa:
  extends: .test-unit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'fullqa'
      when: always
    - when: never
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL

test:postrun:fullqa:
  extends: .test-postrun
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'unitTest' && $CI_COMMIT_REF_NAME == 'fullqa'
      when: delayed
      start_in: 90 minutes
    - when: never
  needs: ["test:unit:fullqa"]
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL

test:predeploy:fullqa:
  extends: .validate-metadata
  stage: test
  resource_group: fullqa
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'fullqa'
      when: manual
    - if: $BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//
      when: manual
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: validate-fullqa
    url: $FULLQA_ORG_URL

deploy:fullqa:
  extends: .deploy-metadata
  stage: deploy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: manual
      needs:
        - job: "deploy:dev"
          optional: true
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL

destroy:fullqa:
  extends: .delete-metadata
  stage: destroy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'web' && $PACKAGE
      when: always
  allow_failure: false
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL

destroy:fullqa:push:
  extends: .delete-metadata-push
  stage: destroy
  resource_group: fullqa
  rules:
    - if: $FULLQA_DISABLED
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(metadata-retrieval\):/i'
      when: never
    - if: $CI_COMMIT_REF_NAME == 'fullqa' && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $BRANCHING_MODEL == 'release' && $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BEFORE_SHA != '0000000000000000000000000000000000000000'
      when: manual
      needs:
        - job: "destroy:dev:push"
          optional: true
      variables:
        DELTA_BASE_BRANCH: $CI_DEFAULT_BRANCH
  allow_failure: true
  variables:
    AUTH_ALIAS: FULLQA
    AUTH_CLIENT_ID: $FULLQA_JWT_CLIENT_ID
    AUTH_JWT_KEY_FILE: $FULLQA_JWT_KEY
    AUTH_USERNAME: $FULLQA_USERNAME
    AUTH_INSTANCE_URL: $FULLQA_INSTANCE_URL
  environment:
    name: fullqa
    url: $FULLQA_ORG_URL
