####################################################
# Base Salesforce Deployment Templates
# Core authentication, validation, deployment, and deletion logic
####################################################

####################################################
# Authenticate to a Salesforce org and prepare the deployment package.
# For deploy/test stages: generates an incremental package via sfdx-git-delta
# and merges any extra metadata declared in the <Package> block of $COMMIT_MSG.
# For web destroy stage: converts $PACKAGE (sf-package-list format) to XML.
####################################################
.authenticate:
  before_script:
    - echo $AUTH_URL | sf org login sfdx-url --set-default --alias $AUTH_ALIAS --sfdx-url-stdin
    - if [ "$CI_JOB_STAGE" == "destroy" ] && [ -n "$PACKAGE" ]; then
        source ./scripts/bash/create_destroy_package.sh;
      elif [ "$CI_JOB_STAGE" != "destroy" ]; then
        source ./scripts/bash/generate_delta_package.sh;
      fi
    - |
      _pkg_result=$(python3 ./scripts/python/package_check.py -x "$DEPLOY_PACKAGE" -s "$CI_JOB_STAGE" -e "$CI_ENVIRONMENT_NAME")
      if [ "$_pkg_result" == "not a test" ]; then
        testclasses="not a test"
      elif [ "$CI_JOB_STAGE" == "destroy" ]; then
        testclasses="$_pkg_result"
      else
        testclasses=$(sf apextests list --format sf -x "$DEPLOY_PACKAGE")
      fi

####################################################
# Validate metadata against a Salesforce org (MR pipelines).
# BEFORE_SHA: common ancestor of source and target branch.
# COMMIT_MSG: MR description (may contain <Package> extra metadata block).
####################################################
.validate-metadata:
  extends: .authenticate
  variables:
    BEFORE_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    COMMIT_MSG: $CI_MERGE_REQUEST_DESCRIPTION
  coverage: '/TOTAL.+ ([0-9]{1,3}(?:\.[0-9]+)?%)/'
  artifacts:
    when: always
    paths:
      - coverage-sonar.xml
      - coverage-html.html
      - coverage-cobertura.xml
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-cobertura.xml
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
    - |
      COVERAGE_FILE="coverage-cobertura.xml"
      if [ -s "$COVERAGE_FILE" ]; then
        LINE_RATE="$(grep -oE '<coverage[^>]*\bline-rate="[^"]+"' "$COVERAGE_FILE" | head -1 | sed -E 's/.*line-rate="([^"]+)".*/\1/')"
        if [ -n "$LINE_RATE" ]; then
          PCT="$(awk -v r="$LINE_RATE" 'BEGIN { printf("%.2f%%", r*100) }')"
          echo "TOTAL coverage: $PCT"
        fi
      fi
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Deploy metadata into a Salesforce org (push pipelines).
# BEFORE_SHA: SHA immediately before this push (CI_COMMIT_BEFORE_SHA).
# COMMIT_MSG: merge commit message (may contain <Package> extra metadata block).
####################################################
.deploy-metadata:
  extends: .authenticate
  variables:
    BEFORE_SHA: $CI_COMMIT_BEFORE_SHA
    COMMIT_MSG: $CI_COMMIT_MESSAGE
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Delete metadata in a Salesforce org (web pipeline, $PACKAGE provided).
####################################################
.delete-metadata:
  extends: .authenticate
  variables:
    DEPLOY_PACKAGE: "destructive/destructiveChanges.xml"
    DESTRUCTIVE_PACKAGE: "destructive/package.xml"
  script:
    - source ./scripts/bash/destroy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Destroy metadata via sfdx-git-delta on push pipelines.
# Runs sgd before package_check.py so the destructiveChanges.xml exists first.
# allow_failure: true on callers — exits 0 when delta has no destructive types.
####################################################
.delete-metadata-push:
  before_script:
    - echo $AUTH_URL | sf org login sfdx-url --set-default --alias $AUTH_ALIAS --sfdx-url-stdin
    - sf sgd source delta --from "$CI_COMMIT_BEFORE_SHA" --output-dir .
    - |
      _pkg_result=$(python3 ./scripts/python/package_check.py -x "$DEPLOY_PACKAGE" -s "$CI_JOB_STAGE" -e "$CI_ENVIRONMENT_NAME")
      if [ "$_pkg_result" == "not a test" ]; then
        testclasses="not a test"
      else
        testclasses="$_pkg_result"
      fi
  variables:
    DEPLOY_PACKAGE: "destructiveChanges/destructiveChanges.xml"
    DESTRUCTIVE_PACKAGE: "destructiveChanges/package.xml"
  script:
    - |
      if ! grep -q '<types>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        echo "No destructive types in git delta, skipping destroy."
        exit 0
      fi
    - source ./scripts/bash/destroy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

