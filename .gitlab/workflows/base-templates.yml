####################################################
# Base Salesforce Deployment Templates
# Core authentication, validation, deployment, and deletion logic
####################################################

####################################################
# Authenticate to a Salesforce org.
# Used as a building block via !reference in prepare-deploy and prepare-destroy.
####################################################
.authenticate:
  before_script:
    - echo $AUTH_URL | sf org login sfdx-url --set-default --alias $AUTH_ALIAS --sfdx-url-stdin

####################################################
# Prepare a deploy/validate job: generate delta package, strip ConnectedApp
# secrets, and discover test classes via apextestlist annotations.
# BEFORE_SHA and COMMIT_MSG must be set by the extending job.
####################################################
.prepare-deploy:
  before_script:
    - !reference [.authenticate, before_script]
    - source ./scripts/bash/generate_delta_package.sh
    - |
      while IFS= read -r f; do
        sed -i '/<consumerKey>/d' "$f" && echo "Stripped consumerKey from: $f"
      done < <(find . -path '*/connectedApps/*.connectedApp-meta.xml' -type f)
      testclasses=$(sf apextests list --format sf -x "$DEPLOY_PACKAGE" --no-warnings)
      if [ -z "$testclasses" ] && grep -qE '<name>(ApexClass|ApexTrigger)</name>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        echo "ERROR: Apex found in package but no test annotations found. Add @tests: or @testsuites: annotations."
        exit 1
      fi
      [ -z "$testclasses" ] && testclasses="not a test"

####################################################
# Validate metadata against a Salesforce org (MR pipelines).
# BEFORE_SHA: common ancestor of source and target branch.
# COMMIT_MSG: MR description (may contain <Package> extra metadata block).
####################################################
.validate-metadata:
  extends: .prepare-deploy
  variables:
    BEFORE_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    COMMIT_MSG: $CI_MERGE_REQUEST_DESCRIPTION
  coverage: '/TOTAL.+ ([0-9]{1,3}(?:\.[0-9]+)?%)/'
  artifacts:
    when: always
    paths:
      - coverage-sonar.xml
      - coverage-html.html
      - coverage-cobertura.xml
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-cobertura.xml
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
    - |
      COVERAGE_FILE="coverage-cobertura.xml"
      if [ -s "$COVERAGE_FILE" ]; then
        LINE_RATE="$(grep -oE '<coverage[^>]*\bline-rate="[^"]+"' "$COVERAGE_FILE" | head -1 | sed -E 's/.*line-rate="([^"]+)".*/\1/')"
        if [ -n "$LINE_RATE" ]; then
          PCT="$(awk -v r="$LINE_RATE" 'BEGIN { printf("%.2f%%", r*100) }')"
          echo "TOTAL coverage: $PCT"
        fi
      fi
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Deploy metadata into a Salesforce org (push pipelines).
# BEFORE_SHA: SHA immediately before this push (CI_COMMIT_BEFORE_SHA).
# COMMIT_MSG: merge commit message (may contain <Package> extra metadata block).
####################################################
.deploy-metadata:
  extends: .prepare-deploy
  variables:
    BEFORE_SHA: $CI_COMMIT_BEFORE_SHA
    COMMIT_MSG: $CI_COMMIT_MESSAGE
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Prepare a web destroy job: convert $PACKAGE (sf-package-list format) to XML
# and resolve test classes from DESTRUCTIVE_TESTS for production Apex destroys.
####################################################
.prepare-destroy:
  before_script:
    - !reference [.authenticate, before_script]
    - source ./scripts/bash/create_destroy_package.sh
    - |
      if [ "$CI_ENVIRONMENT_NAME" == "production" ] && grep -qE '<name>(ApexClass|ApexTrigger)</name>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        if [ -n "$DESTRUCTIVE_TESTS" ]; then
          testclasses="$DESTRUCTIVE_TESTS"
        else
          echo "ERROR: DESTRUCTIVE_TESTS is not set. Set it to a space-separated list of test classes before destroying Apex in production."
          exit 1
        fi
      else
        testclasses="not a test"
      fi

####################################################
# Delete metadata in a Salesforce org (web pipeline, $PACKAGE provided).
####################################################
.delete-metadata:
  extends: .prepare-destroy
  variables:
    DEPLOY_PACKAGE: "destructiveChanges/destructiveChanges.xml"
    DESTRUCTIVE_PACKAGE: "destructiveChanges/package.xml"
  script:
    - source ./scripts/bash/destroy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Destroy metadata via sfdx-git-delta on push pipelines.
# allow_failure: true on callers — exits 0 when delta has no destructive types.
####################################################
.delete-metadata-push:
  before_script:
    - !reference [.authenticate, before_script]
    - sf sgd source delta --from "$CI_COMMIT_BEFORE_SHA" --output-dir .
    - |
      if [ "$CI_ENVIRONMENT_NAME" == "production" ] && grep -qE '<name>(ApexClass|ApexTrigger)</name>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        if [ -n "$DESTRUCTIVE_TESTS" ]; then
          testclasses="$DESTRUCTIVE_TESTS"
        else
          echo "ERROR: DESTRUCTIVE_TESTS is not set. Set it to a space-separated list of test classes before destroying Apex in production."
          exit 1
        fi
      else
        testclasses="not a test"
      fi
  variables:
    DEPLOY_PACKAGE: "destructiveChanges/destructiveChanges.xml"
    DESTRUCTIVE_PACKAGE: "destructiveChanges/package.xml"
  script:
    - |
      if ! grep -q '<types>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        echo "No destructive types in git delta, skipping destroy."
        exit 0
      fi
    - source ./scripts/bash/destroy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build
