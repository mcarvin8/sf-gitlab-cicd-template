####################################################
# Base Salesforce Deployment Templates
# Core authentication, validation, deployment, and deletion logic
####################################################

####################################################
# Install the four sf CLI plugins the Dockerfile bakes in. Skips any plugin
# already installed, so it is a near no-op on the custom Dockerfile image.
# Reuse via !reference in jobs that define their own before_script.
####################################################
.install-sf-plugins:
  before_script:
    - |
      installed=$(sf plugins 2>/dev/null)
      for plugin in "sfdx-git-delta@^7.3.0" "apex-code-coverage-transformer@latest" "sf-package-list@latest" "apextestlist@^1.15.0"; do
        name="${plugin%@*}"
        if echo "$installed" | grep -q "^${name} "; then
          echo "Plugin already installed: $name"
        else
          echo y | sf plugins install "$plugin"
        fi
      done
      sf version --verbose --json || true

####################################################
# Run a job on Salesforce's prebuilt sf CLI image instead of the custom
# Dockerfile image - no Docker-in-Docker build or container registry needed.
# Plugins are installed at runtime on every job (see .install-sf-plugins).
# Env vars mirror the Dockerfile. The image ships sf (bundled Node, no npm),
# git, curl, jq, and Java 11 on heroku/heroku:22, running as root.
# Jobs that set their own before_script override this one; prepend
# `- !reference [.install-sf-plugins, before_script]` there instead.
####################################################
.sf-cli-slim:
  image: salesforce/cli:latest-slim
  variables:
    SF_AUTOUPDATE_DISABLE: "true"
    SF_USE_GENERIC_UNIX_KEYCHAIN: "true"
    SF_DOMAIN_RETRY: "300"
    SF_PROJECT_AUTOUPDATE_DISABLE_FOR_PACKAGE_CREATE: "true"
    SF_PROJECT_AUTOUPDATE_DISABLE_FOR_PACKAGE_VERSION_CREATE: "true"
    SF_DISABLE_DNS_CHECK: "true"
    SF_DISABLE_SOURCE_MEMBER_POLLING: "true"
    SF_HIDE_RELEASE_NOTES: "true"
    SF_HIDE_RELEASE_NOTES_FOOTER: "true"
    SF_SKIP_NEW_VERSION_CHECK: "true"
    SF_CONTAINER_MODE: "true"
    SF_CI_HEARTBEAT_FREQUENCY_MS: "60000"
    NODE_NO_WARNINGS: "1"
  before_script:
    - !reference [.install-sf-plugins, before_script]

####################################################
# Shared rule: skip MR pipelines whose source is a long-lived org branch
# (e.g. a $DEV_BRANCH -> $FULLQA_BRANCH or default-branch backfill MR); only
# story/release branches are validated and scanned.
# Use as the first entry of a job's rules: - !reference [.skip-org-branch-sources, rules]
####################################################
.skip-org-branch-sources:
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $DEV_BRANCH || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $FULLQA_BRANCH || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never

####################################################
# Shared setup for jobs that push to the repo with the maintainer PAT.
# before_script sets git identity and push credentials (scripts/bash/maintainer_git.sh).
# after_script runs even when the job fails: it aborts any half-done merge/rebase,
# returns to the pipeline commit and deletes the local branches the job checked
# out, so a reused build directory starts clean.
# Full history is needed for merges, reverts and branch age checks.
# Jobs that define their own before_script/after_script reuse these via !reference.
####################################################
.maintainer-git:
  variables:
    GIT_DEPTH: "0"
  before_script:
    - source ./scripts/bash/maintainer_git.sh
    - setup_maintainer_git
  after_script:
    - git merge --abort 2>/dev/null || true
    - git rebase --abort 2>/dev/null || true
    - git -c advice.detachedHead=false checkout -q -f "$CI_COMMIT_SHA"
    - git for-each-ref --format='%(refname:short)' refs/heads | xargs -r git branch -D

####################################################
# Authenticate to a Salesforce org.
# Used as a building block via !reference in prepare-deploy and prepare-destroy.
####################################################
.authenticate:
  before_script:
    - sf org login jwt --client-id "$AUTH_CLIENT_ID" --jwt-key-file "$AUTH_JWT_KEY_FILE" --username "$AUTH_USERNAME" --instance-url "$AUTH_INSTANCE_URL" --set-default --alias "$AUTH_ALIAS"

####################################################
# Prepare a deploy/validate job: generate delta package from sfdx-git-delta,
# strip ConnectedApp secrets, and discover test classes via apextestlist
# annotations. CI_COMMIT_BEFORE_SHA must be set on push pipelines (see .deploy-metadata).
# MR pipelines diff via --merge-base against origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
# (three-dot semantics) instead of trusting CI_MERGE_REQUEST_DIFF_BASE_SHA,
# which can go stale after a rebase/force-push; push pipelines diff straight
# from CI_COMMIT_BEFORE_SHA since branch history there is already linear, unless
# DELTA_BASE_BRANCH is set (release branching model): then the push diffs from the
# merge-base with origin/$DELTA_BASE_BRANCH, so every deploy carries the whole
# release and a skipped/failed/manual run can't leave earlier pushes undeployed.
# DEPLOY_PACKAGE defaults to sfdx-git-delta's own output path (package/package.xml),
# so no copy step is needed.
# Deletions in the same delta ($DESTRUCTIVE_CHANGES) ride along in the same
# deployment/validation when AUTO_DESTROY is "true", so additions, changes and
# deletions succeed or fail together. Post-destructive by default (references
# are removed before the component is deleted); "[pre-destructive]" in the
# commit message or MR title, or DESTRUCTIVE_MODE=pre, deletes first instead.
# Apex deletions in production with no Apex in the constructive package run
# DESTRUCTIVE_TESTS, since apextestlist has nothing to resolve tests from.
# Requires: sfdx-git-delta >= 7.3.0 (adds --merge-base), apextestlist >= 1.15.0
# (adds -e/--fail-on-empty manifest scanning, so the plugin itself fails the
# job when the manifest has Apex but no resolvable tests).
####################################################
.prepare-deploy:
  before_script:
    - !reference [.authenticate, before_script]
    - |
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        sf sgd source delta --from "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --merge-base --output-dir .
      elif [ -n "${DELTA_BASE_BRANCH:-}" ]; then
        sf sgd source delta --from "origin/${DELTA_BASE_BRANCH}" --merge-base --output-dir .
      else
        sf sgd source delta --from "$CI_COMMIT_BEFORE_SHA" --output-dir .
      fi
      echo "=== Deployment Package ==="
      sf sfpl list -x "$DEPLOY_PACKAGE" || true
      echo "=========================="
    - |
      while IFS= read -r f; do
        sed -i '/<consumerKey>/d' "$f" && echo "Stripped consumerKey from: $f"
      done < <(find . -path '*/connectedApps/*.connectedApp-meta.xml' -type f)
      testclasses=$(sf apextests list --format sf -x "$DEPLOY_PACKAGE" --no-warnings --fail-on-empty)
      [ -z "$testclasses" ] && testclasses="not a test"
    - |
      destructive_flags=""
      if [ "$AUTO_DESTROY" == "true" ] && grep -q '<types>' "$DESTRUCTIVE_CHANGES" 2>/dev/null; then
        destructive_mode="${DESTRUCTIVE_MODE:-post}"
        if [[ "${CI_COMMIT_MESSAGE:-} ${CI_MERGE_REQUEST_TITLE:-}" == *"[pre-destructive]"* ]]; then
          destructive_mode="pre"
        fi
        if [ "$destructive_mode" != "pre" ] && [ "$destructive_mode" != "post" ]; then
          echo "ERROR: DESTRUCTIVE_MODE must be \"pre\" or \"post\", got \"$destructive_mode\"."
          exit 1
        fi
        destructive_flags="--${destructive_mode}-destructive-changes $DESTRUCTIVE_CHANGES"
        echo "=== Destructive Changes (${destructive_mode}-destructive) ==="
        sf sfpl list -x "$DESTRUCTIVE_CHANGES" || true
        echo "=========================="
        if [ "$testclasses" == "not a test" ] && [[ "$CI_ENVIRONMENT_NAME" == *production ]] && grep -qE '<name>(ApexClass|ApexTrigger)</name>' "$DESTRUCTIVE_CHANGES"; then
          if [ -z "$DESTRUCTIVE_TESTS" ]; then
            echo "ERROR: DESTRUCTIVE_TESTS is not set. Set it to a space-separated list of test classes before destroying Apex in production."
            exit 1
          fi
          testclasses=$(printf -- '--tests %s ' $DESTRUCTIVE_TESTS)
        fi
      fi

####################################################
# Validate metadata against a Salesforce org (MR pipelines).
# Delta base is the merge-base with the target branch, resolved in
# .prepare-deploy via CI_MERGE_REQUEST_TARGET_BRANCH_NAME;
####################################################
.validate-metadata:
  extends: .prepare-deploy
  coverage: '/TOTAL.+ ([0-9]{1,3}(?:\.[0-9]+)?%)/'
  artifacts:
    when: always
    paths:
      - coverage-sonar.xml
      - coverage-html.html
      - coverage-cobertura.xml
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-cobertura.xml
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
    - |
      COVERAGE_FILE="coverage-cobertura.xml"
      if [ -s "$COVERAGE_FILE" ]; then
        LINE_RATE="$(grep -oE '<coverage[^>]*\bline-rate="[^"]+"' "$COVERAGE_FILE" | head -1 | sed -E 's/.*line-rate="([^"]+)".*/\1/')"
        if [ -n "$LINE_RATE" ]; then
          PCT="$(awk -v r="$LINE_RATE" 'BEGIN { printf("%.2f%%", r*100) }')"
          echo "TOTAL coverage: $PCT"
        fi
      fi
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Deploy metadata into a Salesforce org (push pipelines).
####################################################
.deploy-metadata:
  extends: .prepare-deploy
  script:
    - source ./scripts/bash/deploy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build

####################################################
# Prepare a web destroy job: convert $PACKAGE (sf-package-list format) to XML
# and resolve test classes from DESTRUCTIVE_TESTS for production Apex destroys.
####################################################
.prepare-destroy:
  before_script:
    - !reference [.authenticate, before_script]
    - source ./scripts/bash/create_destroy_package.sh
    - |
      if [ "$CI_ENVIRONMENT_NAME" == "production" ] && grep -qE '<name>(ApexClass|ApexTrigger)</name>' "$DEPLOY_PACKAGE" 2>/dev/null; then
        if [ -n "$DESTRUCTIVE_TESTS" ]; then
          testclasses="$DESTRUCTIVE_TESTS"
        else
          echo "ERROR: DESTRUCTIVE_TESTS is not set. Set it to a space-separated list of test classes before destroying Apex in production."
          exit 1
        fi
      else
        testclasses="not a test"
      fi

####################################################
# Delete metadata in a Salesforce org (web pipeline, $PACKAGE provided).
# Standalone destructive deployment, independent of the git delta, for
# deletions that need their own ordering or aren't represented in git.
# Git-tracked deletions deploy with the delta instead (see .prepare-deploy).
####################################################
.delete-metadata:
  extends: .prepare-destroy
  variables:
    DEPLOY_PACKAGE: "destructiveChanges/destructiveChanges.xml"
    DESTRUCTIVE_PACKAGE: "destructiveChanges/package.xml"
  script:
    - source ./scripts/bash/destroy_metadata_sf.sh
  after_script:
    - source ./scripts/bash/deploy_slack_status.sh; share_slack_update_build
