####################################################
# Maintenance and Utility Pipeline Jobs
# These jobs are separate from the core deployment pipeline
# and handle various maintenance operations
####################################################

####################################################
# Rollback pipeline.
# Only runs on web-based pipelines on org branches when $SHA variable is provided.
####################################################
rollback:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web' && $SHA && ($CI_COMMIT_REF_NAME == 'develop' || $CI_COMMIT_REF_NAME == 'fullqa' || $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH)
      when: always
    - when: never
  allow_failure: false
  script:
    - source ./scripts/bash/rollback.sh

####################################################
# Create or refresh a sandbox.
####################################################
sandboxRefresh:
  stage: maintenance
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $SANDBOX && $CI_COMMIT_TAG =~ /^sandbox_v\d+$/'
      when: always
    - when: never
  allow_failure: false
  script:
    - echo $PRODUCTION_AUTH_URL | sf org login sfdx-url --set-default --alias PRODUCTION --sfdx-url-stdin
    - source ./scripts/bash/create_sandbox.sh

####################################################
# Push production commits back to sandbox branches.
# This will skip CI pipelines when pushing to GitLab.
# Allowed to fail in order to not block a production pipeline.
####################################################
prodBackfill:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'push'
      when: always
    - when: never
  allow_failure: true
  script:
    - source ./scripts/bash/merge_main_into_sbx.sh

####################################################
# Retrieve metadata from sandboxes into GitLab branches (parallel: one job per branch).
# $PACKAGE_NAME must be set (file under scripts/packages). Same schedule as before
# ($JOB_NAME == sbxBackfill); both jobs run together and do not share git state.
####################################################
.packageBackfillSbxBase:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PACKAGE_NAME && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'sbxBackfill'
      when: always
    - when: never
  allow_failure: false

packageBackfillSbxFullqa:
  extends: .packageBackfillSbxBase
  variables:
    ORG_BRANCH: fullqa
  script:
    - echo $FULLQA_AUTH_URL | sf org login sfdx-url --set-default --alias fullqa --sfdx-url-stdin
    - source ./scripts/bash/retrieve_packages.sh

packageBackfillSbxDevelop:
  extends: .packageBackfillSbxBase
  variables:
    ORG_BRANCH: develop
  script:
    - echo $SANDBOX_AUTH_URL | sf org login sfdx-url --set-default --alias develop --sfdx-url-stdin
    - source ./scripts/bash/retrieve_packages.sh

packageBackfillPrd:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PACKAGE_NAME && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'prdBackfill'
      when: always
    - when: never
  allow_failure: false
  variables:
    ORG_BRANCH: $CI_DEFAULT_BRANCH
  script:
    - echo $PRODUCTION_AUTH_URL | sf org login sfdx-url --set-default --alias main --sfdx-url-stdin
    - source ./scripts/bash/retrieve_packages.sh

####################################################
# Delete stale branches.
# Protected branches are unable to be deleted this way.
####################################################
branchCleanup:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'monthlyMaintenance'
      when: always
    - when: never
  allow_failure: false
  script:
    - source ./scripts/bash/delete_stale_branches.sh

####################################################
# Delete stale pipelines.
# Requires an HTTPS token with "Owner" access.
####################################################
pipelineCleanup:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'monthlyMaintenance'
      when: always
    - when: never
  allow_failure: false
  script:
    - source ./scripts/bash/delete_stale_pipelines.sh

####################################################
# Weekly metadata audit: AI summaries via sf-git-ai-meta-insights uploaded to Confluence.
# Configure TEAM_JIRA_REGEX in metadata_audit.sh and set CONFLUENCE_* + LLM vars.
####################################################
metadataAudit:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'metadataAudit'
      when: always
    - when: never
  allow_failure: false
  script:
    - echo y | sf plugins install sf-git-ai-meta-insights@latest
    - source ./scripts/bash/metadata_audit.sh

####################################################
# Executes GitLab sandbox refresh steps.
####################################################
refreshSbxBranches:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'refreshSbxBranches'
      when: always
    - when: never
  allow_failure: false
  script:
    - source ./scripts/bash/refresh_sandbox_branches.sh

####################################################
# Auto-promote Johnny Cash triage agent MRs.
# When @svc-johnny-triage-agent opens an MR into main, this job opens
# the two companion MRs (story -> develop, story -> fullqa) required
# by the 3-branch promotion path. Idempotent: skips targets that
# already have an open MR from the same source branch.
####################################################
johnnyPromoteMR:
  stage: maintenance
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $GITLAB_USER_LOGIN == 'svc-johnny-triage-agent'
      when: always
    - when: never
  allow_failure: true
  script:
    - source ./scripts/bash/promote_johnny_mr.sh
