####################################################
# Maintenance and Utility Pipeline Jobs
# These jobs are separate from the core deployment pipeline
# and handle various maintenance operations
####################################################

####################################################
# Rollback pipeline.
# Only runs on web-based pipelines on org branches when $SHA variable is provided.
####################################################
rollback:
  extends: .maintainer-git
  stage: maintenance
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web' && $SHA && ($CI_COMMIT_REF_NAME == $DEV_BRANCH || $CI_COMMIT_REF_NAME == $FULLQA_BRANCH || $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH)
      when: always
  script:
    - source ./scripts/bash/rollback.sh

####################################################
# Create or refresh a sandbox.
####################################################
sandboxRefresh:
  extends: .prd-auth
  stage: maintenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $SANDBOX && $CI_COMMIT_TAG =~ /^sandbox_v\d+$/'
      when: always
  before_script:
    - !reference [.authenticate, before_script]
  script:
    - source ./scripts/bash/create_sandbox.sh

####################################################
# Push production commits back to sandbox branches.
# This will skip CI pipelines when pushing to GitLab.
# Allowed to fail in order to not block a production pipeline.
# Org branching model only.
####################################################
prodBackfill:
  extends: .maintainer-git
  stage: maintenance
  rules:
    - if: $BRANCHING_MODEL != 'release' && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'push'
      when: always
  allow_failure: true
  script:
    - source ./scripts/bash/backfill_prod_into_sbx.sh

####################################################
# Retrieve metadata from sandboxes into GitLab branches (parallel: one job per branch).
# $PACKAGE_NAME must be set (file under scripts/packages). Same schedule as before
# ($JOB_NAME == sbxBackfill); both jobs run together and do not share git state.
# Sandbox backfills are org branching model only; packageBackfillPrd overrides
# these rules and runs in both models.
# Org credentials come from the .<org>-auth templates defined by each orgs/org.yml include.
####################################################
.packageBackfillSbxBase:
  extends: .maintainer-git
  stage: maintenance
  rules:
    - if: $BRANCHING_MODEL != 'release' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PACKAGE_NAME && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'sbxBackfill'
      when: always
  before_script:
    - !reference [.maintainer-git, before_script]
    - !reference [.authenticate, before_script]

packageBackfillSbxFullqa:
  extends: [.packageBackfillSbxBase, .fullqa-auth]
  variables:
    ORG_BRANCH: $FULLQA_BRANCH
  script:
    - source ./scripts/bash/retrieve_packages.sh

packageBackfillSbxDevelop:
  extends: [.packageBackfillSbxBase, .dev-auth]
  variables:
    ORG_BRANCH: $DEV_BRANCH
  script:
    - source ./scripts/bash/retrieve_packages.sh

packageBackfillPrd:
  extends: [.packageBackfillSbxBase, .prd-auth]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PACKAGE_NAME && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'prdBackfill'
      when: always
  variables:
    ORG_BRANCH: $CI_DEFAULT_BRANCH
  script:
    - source ./scripts/bash/retrieve_packages.sh

####################################################
# Delete stale branches.
# Protected branches are unable to be deleted this way.
####################################################
branchCleanup:
  extends: .maintainer-git
  stage: maintenance
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'monthlyMaintenance'
      when: always
  script:
    - source ./scripts/bash/delete_stale_branches.sh

####################################################
# Delete stale pipelines.
# Requires an HTTPS token with "Owner" access.
####################################################
pipelineCleanup:
  stage: maintenance
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'monthlyMaintenance'
      when: always
  script:
    - source ./scripts/bash/delete_stale_pipelines.sh

####################################################
# Weekly metadata audit: AI summaries via sf-git-ai-meta-insights uploaded to Confluence.
# Configure TEAM_JIRA_REGEX in metadata_audit.sh and set CONFLUENCE_* + LLM vars.
####################################################
metadataAudit:
  stage: maintenance
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'metadataAudit'
      when: always
  script:
    - echo y | sf plugins install sf-git-ai-meta-insights@latest
    - source ./scripts/bash/metadata_audit.sh

####################################################
# Executes GitLab sandbox refresh steps.
# Org branching model only (recreates the $DEV_BRANCH/$FULLQA_BRANCH org branches).
####################################################
refreshSbxBranches:
  extends: .maintainer-git
  stage: maintenance
  rules:
    - if: $BRANCHING_MODEL != 'release' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'refreshSbxBranches'
      when: always
  script:
    - source ./scripts/bash/refresh_sandbox_branches.sh

####################################################
# Auto-promote AI triage agent MRs.
# When the configured AI agent service account opens an MR into main,
# this job opens the two companion MRs (story -> $DEV_BRANCH, story -> $FULLQA_BRANCH)
# required by the 3-branch promotion path. Idempotent: skips targets that
# already have an open MR from the same source branch.
# Org branching model only.
####################################################
agentPromoteMR:
  stage: maintenance
  rules:
    - if: $BRANCHING_MODEL != 'release' && $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $GITLAB_USER_LOGIN == $AI_AGENT_USERNAME
      when: always
  allow_failure: true
  script:
    - source ./scripts/bash/promote_agent_mr.sh
