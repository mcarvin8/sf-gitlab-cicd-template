####################################################
# Test and Quality Jobs
# Unit testing, Salesforce Code Analyzer (PMD engine), and SonarQube quality gates
####################################################

####################################################
# Base templates for running all local Apex tests on a schedule.
# Trigger: scheduled pipeline with $JOB_NAME=unitTest on the org branch.
# Org jobs from orgs/org.yml (one include per org) extend these and supply JWT credentials,
# AUTH_ALIAS, branch rule, and needs reference.
####################################################
.test-unit:
  stage: test
  artifacts:
    paths:
      - test_run_id.txt
    expire_in: 1 day
  before_script:
    - !reference [.authenticate, before_script]
  script:
    - sf apex run test --test-level RunLocalTests --result-format human > ./id.txt
    - source ./scripts/bash/extract_test_id.sh

.test-postrun:
  stage: test
  artifacts:
    paths:
      # One coverage-<format>.<ext> file per COVERAGE_FORMATS entry
      - coverage-*
      - coverage/*
    expire_in: 2 weeks
  before_script:
    - !reference [.authenticate, before_script]
  script:
    - TEST_RUN_ID=$(cat test_run_id.txt)
    # set || true so the job passes even if there are test failures
    - sf apex get test --test-run-id $TEST_RUN_ID --code-coverage -r json -d "coverage" > result.json || true
    - source ./scripts/bash/parse_test_result.sh
  after_script:
    - source ./scripts/bash/post_test_result.sh; share_test_result

####################################################
# Scan changed Apex and Flows with Salesforce Code Analyzer (PMD + Flow engines).
# Java, Python and the code-analyzer/sf-cat plugins are baked into the default
# pipeline image (see Dockerfile). salesforce/cli:latest-full ships Java and
# Python; with SF_INSTALL_PLUGINS "true" .install-sf-plugins adds the plugins.
# Scans every package directory in sfdx-project.json, and sf-cat converts the
# results to each CODE_ANALYZER_FORMATS entry (codeclimate feeds the GitLab
# Code Quality MR widget, sonar feeds the quality job).
####################################################
code-analyzer-check:
  stage: quality
  allow_failure: true
  variables:
    CODE_ANALYZER_REPORT: "code-analyzer-report.json"
  rules:
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $FULLQA_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $DEV_BRANCH || ($BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//)
      changes:
        - "**/*.cls"
        - "**/*.trigger"
        - "**/*.flow-meta.xml"
      when: always
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'fullQualityCodeScan'
      when: always
  before_script:
    - !reference [.install-sf-plugins, before_script]
  script:
    # The image must provide Java (PMD engine) and Python (Flow engine).
    # Code Analyzer tags every rule declared in a custom ruleset with the
    # ruleset's own `name` attribute (spaces stripped) -- default_apex.xml's
    # <ruleset name="Enforced Apex Rules"> becomes the "EnforcedApexRules" tag.
    # Targets are the package directories in sfdx-project.json. sf code-analyzer
    # errors hard if a --target path doesn't exist (unlike the old pmd binary);
    # see PlaceholderTrigger.trigger and Placeholder.flow-meta.xml.
    - |
      source ./scripts/bash/package_dirs.sh
      targets=()
      while IFS= read -r dir; do
        targets+=(--target "$dir")
      done < <(sf_package_dirs)
      sf code-analyzer run "${targets[@]}" \
        --rule-selector "pmd:EnforcedApexRules,flow:Recommended" \
        --config-file code-analyzer.yml \
        --output-file "${CODE_ANALYZER_REPORT}" \
        --view detail
    # Translate Code Analyzer's own JSON schema into each requested format.
    - |
      for format in ${CODE_ANALYZER_FORMATS//,/ }; do
        case "$format" in
          sonar)       output="sonar-issues.json" ;;
          codeclimate) output="gl-code-quality-report.json" ;;
          sarif)       output="code-analyzer.sarif" ;;
          junit)       output="code-analyzer-junit.xml" ;;
          *) echo "Unsupported CODE_ANALYZER_FORMATS entry '$format' (expected sonar, codeclimate, sarif or junit)."; exit 1 ;;
        esac
        sf cat transform -i "${CODE_ANALYZER_REPORT}" -f "$format" -o "$output" --project-relative
      done
  artifacts:
    paths:
      - "${CODE_ANALYZER_REPORT}"
      - sonar-issues.json
      - gl-code-quality-report.json
      - code-analyzer.sarif
      - code-analyzer-junit.xml
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 2 weeks

####################################################
# SonarQube quality gate analysis.
# Runs only when SONAR_URL is set (with SONAR_TOKEN); otherwise it is skipped.
# Needs "sonar" in COVERAGE_FORMATS and CODE_ANALYZER_FORMATS to import
# coverage and Code Analyzer issues.
# `needs` limits artifact downloads to the listed jobs, so the predeploy
# validations must be listed to pass coverage-sonar.xml through. They are
# optional because only the ones matching the MR target exist (none on
# scheduled scans), and since they are manual, this job waits until the
# validation has been played. Add your own test:predeploy:<org> jobs here.
####################################################
quality:
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
  stage: quality
  cache:
    key: $CI_JOB_NAME
    paths:
      - .sonar/cache
  needs:
    - job: "code-analyzer-check"
    - job: "test:predeploy:dev"
      optional: true
    - job: "test:predeploy:fullqa"
      optional: true
    - job: "test:predeploy:prd"
      optional: true
  rules:
    - if: $SONAR_URL == null || $SONAR_URL == ""
      when: never
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $FULLQA_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $DEV_BRANCH || ($BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//)
      changes:
        - "**/*.cls"
        - "**/*.trigger"
      variables:
        SONAR_REF: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      when: always
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'fullQualityCodeScan'
      when: always
      variables:
        SONAR_REF: $CI_COMMIT_REF_NAME
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_LOGIN: $SONAR_TOKEN
    SONAR_HOST_URL: $SONAR_URL
    SONAR_GATE: "false"
  script:
    # Import coverage and Code Analyzer issues only when their reports exist
    - |
      set -- \
        -Dsonar.qualitygate.wait=$SONAR_GATE \
        -Dsonar.projectKey=$CI_PROJECT_PATH_SLUG \
        -Dsonar.gitlab.ref_name=$SONAR_REF \
        -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHORT_SHA
      if [ -f coverage-sonar.xml ]; then
        set -- "$@" -Dsonar.coverageReportPaths=coverage-sonar.xml
      fi
      if [ -f sonar-issues.json ]; then
        set -- "$@" -Dsonar.externalIssuesReportPaths=sonar-issues.json
      fi
      sonar-scanner "$@"

####################################################
# MR GitLab Workflow Compliance Checks (main + sandbox).
# Sandbox targets are $DEV_BRANCH/$FULLQA_BRANCH (org model) or release/* (release model).
# Advisory by default (posts an MR comment); set PRE_MERGE_CHECK_ENFORCE to
# "true" to also fail the job when any check fails.
####################################################
pre-merge-check:
  stage: quality
  rules:
    - !reference [.skip-org-branch-sources, rules]
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $FULLQA_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $DEV_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($BRANCHING_MODEL == 'release' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//)
      when: always
  before_script:
    - !reference [.install-sf-plugins, before_script]
  script:
    - source ./scripts/bash/verify_branch_compliance.sh
