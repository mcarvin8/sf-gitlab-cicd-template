####################################################
# Test and Quality Jobs
# Unit testing, Salesforce Code Analyzer (PMD engine), and SonarQube quality gates
####################################################

####################################################
# Base templates for running all local Apex tests on a schedule.
# Trigger: scheduled pipeline with $JOB_NAME=unitTest on the org branch.
# Org-specific jobs in orgs/<org>.yml extend these and supply AUTH_URL,
# AUTH_ALIAS, branch rule, and needs reference.
####################################################
.test-unit:
  stage: test
  allow_failure: false
  artifacts:
    paths:
      - test_run_id.txt
    expire_in: 1 day
  script:
    - echo $AUTH_URL | sf org login sfdx-url --set-default --alias $AUTH_ALIAS --sfdx-url-stdin
    - sf apex run test --test-level RunLocalTests --result-format human > ./id.txt
    - source ./scripts/bash/extract_test_id.sh

.test-postrun:
  stage: test
  allow_failure: false
  artifacts:
    paths:
      - coverage-sonar.xml
      - coverage/*
    expire_in: 2 weeks
  script:
    - TEST_RUN_ID=$(cat test_run_id.txt)
    - echo $AUTH_URL | sf org login sfdx-url --set-default --alias $AUTH_ALIAS --sfdx-url-stdin
    # set || true so the job passes even if there are test failures
    - sf apex get test --test-run-id $TEST_RUN_ID --code-coverage -r json -d "coverage" > result.json || true
    - source ./scripts/bash/parse_test_result.sh
  after_script:
    - source ./scripts/bash/post_test_result.sh; share_slack_update_build

####################################################
# Scan changed Apex and Flows with Salesforce Code Analyzer (PMD + Flow engines).
# Runs on the default pipeline image (sf CLI is already installed there);
# Java, Python, and the Code Analyzer/sf-cat plugins are installed at runtime.
####################################################
code-analyzer-check:
  stage: quality
  allow_failure: true
  cache: []
  variables:
    CODE_ANALYZER_REPORT: "code-analyzer-report.json"
    SONAR_ISSUES_REPORT: "sonar-issues.json"
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      changes:
        - "force-app/main/default/classes/*.cls"
        - "force-app/main/default/triggers/*.trigger"
        - "force-app/main/default/flows/*.flow-meta.xml"
      when: always
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'fullQualityCodeScan'
      when: always
  script:
    # Java is required by the PMD engine, Python by the Flow engine; neither
    # is present in the node:22-bookworm-slim base image.
    - apt-get update && apt-get install -y openjdk-17-jre-headless python3
    - sf plugins install code-analyzer@latest
    - echo y | sf plugins install sf-cat@latest
    # Code Analyzer tags every rule declared in a custom ruleset with the
    # ruleset's own `name` attribute (spaces stripped) -- default_apex.xml's
    # <ruleset name="Enforced Apex Rules"> becomes the "EnforcedApexRules" tag.
    # sf code-analyzer errors hard if a --target path doesn't exist (unlike the
    # old pmd binary), so classes/triggers/flows must always exist -- see
    # PlaceholderTrigger.trigger and Placeholder.flow-meta.xml.
    - >
      sf code-analyzer run
      --target "force-app/main/default/classes"
      --target "force-app/main/default/triggers"
      --target "force-app/main/default/flows"
      --rule-selector "pmd:EnforcedApexRules,flow:Recommended"
      --config-file code-analyzer.yml
      --output-file "${CODE_ANALYZER_REPORT}"
      --view detail
    # Translate Code Analyzer's own JSON schema into SonarQube's generic issue import format.
    - sf cat transform -i "${CODE_ANALYZER_REPORT}" -f sonar -o "${SONAR_ISSUES_REPORT}" --project-relative
  artifacts:
    paths:
      - "${CODE_ANALYZER_REPORT}"
      - "${SONAR_ISSUES_REPORT}"
    expire_in: 2 weeks

####################################################
# SonarQube quality gate analysis.
# Remove this job if you are not running SonarQube.
####################################################
quality:
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
  stage: quality
  cache:
    key: $CI_JOB_NAME
    paths:
      - .sonar/cache
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa'
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      changes:
        - "force-app/main/default/classes/*.cls"
        - "force-app/main/default/triggers/*.trigger"
      variables:
        SONAR_REF: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      when: always
      needs: ["code-analyzer-check"]
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $JOB_NAME == 'fullQualityCodeScan'
      when: always
      variables:
        SONAR_REF: $CI_COMMIT_REF_NAME
      needs: ["code-analyzer-check"]
    - when: never
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_LOGIN: $SONAR_TOKEN
    SONAR_HOST_URL: $SONAR_URL
    SONAR_GATE: "false"
  script:
    - |
      if [ -f coverage-sonar.xml ]; then
        sonar-scanner \
          -Dsonar.qualitygate.wait=$SONAR_GATE \
          -Dsonar.projectKey=$CI_PROJECT_PATH_SLUG \
          -Dsonar.gitlab.ref_name=$SONAR_REF \
          -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHORT_SHA \
          -Dsonar.coverageReportPaths=coverage-sonar.xml \
          -Dsonar.externalIssuesReportPaths=sonar-issues.json
      else
        sonar-scanner \
          -Dsonar.qualitygate.wait=$SONAR_GATE \
          -Dsonar.projectKey=$CI_PROJECT_PATH_SLUG \
          -Dsonar.gitlab.ref_name=$SONAR_REF \
          -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHORT_SHA \
          -Dsonar.externalIssuesReportPaths=sonar-issues.json
      fi

####################################################
# MR GitLab Workflow Compliance Checks (main + sandbox).
####################################################
pre-merge-check:
  stage: quality
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'fullqa' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: always
  allow_failure: false
  cache: []
  script:
    - source ./scripts/bash/verify_branch_compliance.sh
