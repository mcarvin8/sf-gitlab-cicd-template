####################################################
# Default Docker image for all jobs.
# Prebuilt from the included Dockerfile and published to Docker Hub, so the
# pipeline works on the first run. Alternatives:
#   - $CI_REGISTRY_IMAGE:$CI_DEFAULT_BRANCH, built into your own registry by the
#     build job (run it once, e.g. via the dockerBuild schedule, before switching)
#   - salesforce/cli:latest-full with SF_INSTALL_PLUGINS: "true" below, when you
#     can't build images or pull third-party ones (plugins install on every job)
####################################################
image: mcarvin8/sf-cli:latest

####################################################
# Default runner tag applied to every job unless overridden.
# Set RUNNER_TAG as a CI/CD variable in your GitLab project settings.
####################################################
default:
  tags:
    - $RUNNER_TAG

####################################################
# Include pipeline workflow files.
####################################################
include:
  - local: ".gitlab/workflows/base-templates.yml"
  - local: ".gitlab/workflows/build.yml"
  - local: ".gitlab/workflows/test-quality-jobs.yml"
  - local: ".gitlab/workflows/maintenance-pipeline.yml"
  # Org-specific job definitions — add, rename, or remove files under orgs/
  - local: ".gitlab/workflows/orgs/dev.yml"
  - local: ".gitlab/workflows/orgs/fullqa.yml"
  - local: ".gitlab/workflows/orgs/production.yml"

####################################################
# Pipeline stages (sequential order; jobs within a stage run in parallel).
####################################################
stages:
  - build
  - maintenance
  - test
  - quality
  - destroy
  - deploy

####################################################
# Global CI/CD variables.
# Secrets (JWT private keys, PAT_VALUE, NOTIFY_WEBHOOK_URL, etc.) are set in
# GitLab project CI/CD variable settings, not here.
####################################################
variables:
  # Set to "true" when the job image lacks the pipeline's sf CLI plugins (e.g.
  # salesforce/cli:latest-full); every job that runs sf then installs them first
  # (see .install-sf-plugins). Leave "false" for the mcarvin8/sf-cli / Dockerfile image.
  SF_INSTALL_PLUGINS: "false"
  # Salesforce CLI settings for CI, applied whatever the job image (the Dockerfiles
  # set the same values).
  # https://developer.salesforce.com/docs/atlas.en-us.sfdx_setup.meta/sfdx_setup/sfdx_dev_cli_env_variables.htm
  SF_AUTOUPDATE_DISABLE: "true"
  SF_USE_GENERIC_UNIX_KEYCHAIN: "true"
  SF_DOMAIN_RETRY: "300"
  SF_PROJECT_AUTOUPDATE_DISABLE_FOR_PACKAGE_CREATE: "true"
  SF_PROJECT_AUTOUPDATE_DISABLE_FOR_PACKAGE_VERSION_CREATE: "true"
  SF_DISABLE_DNS_CHECK: "true"
  SF_DISABLE_SOURCE_MEMBER_POLLING: "true"
  SF_HIDE_RELEASE_NOTES: "true"
  SF_HIDE_RELEASE_NOTES_FOOTER: "true"
  SF_SKIP_NEW_VERSION_CHECK: "true"
  SF_CONTAINER_MODE: "true"
  SF_CI_HEARTBEAT_FREQUENCY_MS: "60000"
  NODE_NO_WARNINGS: "1"
  # Branching model driving sandbox deployments. The default branch always maps to
  # production in both models.
  #   "org"     - long-running org branches ($DEV_BRANCH -> Dev, $FULLQA_BRANCH -> Full QA).
  #   "release" - short-lived release/* branches deploy to the sandboxes: MRs into
  #               release/* validate against Dev/Full QA, pushes to release/* deploy
  #               to Dev automatically and Full QA manually (after Dev succeeds).
  #               Org-branch-only jobs (sandbox package backfills, prodBackfill,
  #               refreshSbxBranches, agentPromoteMR) are disabled.
  BRANCHING_MODEL: "org"
  # Long-running sandbox org branches (org branching model). Used by job rules and
  # scripts; rename here if your branches differ. The default branch is production.
  DEV_BRANCH: "develop"
  FULLQA_BRANCH: "fullqa"
  # Path to the deployment package generated by sfdx-git-delta (its default output path)
  DEPLOY_PACKAGE: "package/package.xml"
  # sf CLI wait time in minutes for deploys and retrieves
  DEPLOY_TIMEOUT: 120
  # Path to the destructive manifest generated by sfdx-git-delta (its default output path)
  DESTRUCTIVE_CHANGES: "destructiveChanges/destructiveChanges.xml"
  # Set to "true" to deploy deletions detected by sfdx-git-delta together with the
  # delta package (validated on MRs, deployed on push). Set to "false" to ignore
  # git-tracked deletions and only destroy via the web destroy pipeline ($PACKAGE).
  AUTO_DESTROY: "true"
  # Default ordering of git-tracked deletions within the deployment: "post" (delete
  # after deploying, the usual case) or "pre" (delete first, e.g. delete and recreate
  # a component under the same API name). "[pre-destructive]" in the commit message
  # or MR title switches a single change to "pre".
  DESTRUCTIVE_MODE: "post"
  # Space-separated Apex test classes to run when deleting Apex in production and the
  # deployment has no other Apex to resolve tests from.
  # Example: "AccountTriggerHandlerTest ContactTriggerHandlerTest"
  DESTRUCTIVE_TESTS: ""
  # Incoming webhook URL for deploy/test status notifications. Remove or leave empty to disable.
  NOTIFY_WEBHOOK_URL: ""
  # Webhook format: slack, teams, discord, googlechat, mattermost or generic (see scripts/bash/notify.sh).
  NOTIFY_PROVIDER: "slack"
  # Space-separated list of required substrings for MR source branch names.
  # pre-merge-check fails any branch not containing one of these strings.
  # Leave empty to skip branch name enforcement entirely.
  VALID_BRANCH_PREFIXES: ""
  # Comma-separated list of protected sandboxes which shouldn't be refreshed via the sandboxRefresh pipeline.
  DO_NOT_REFRESH: "UAT,QA"
  # GitLab username of the AI triage agent's service account whose MRs into the default
  # branch trigger the agentPromoteMR job. Must match the value used in promote_agent_mr.sh.
  AI_AGENT_USERNAME: "svc-ai-triage-agent"
  # Set to "true" to use validate-then-quick-deploy for production Apex pushes (faster compilation).
  # Recommended for large orgs. Defaults to false (direct deploy with tests).
  QUICK_DEPLOY: "false"
