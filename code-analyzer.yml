# ======================================================================
# CODE ANALYZER CONFIGURATION
# To learn more about this configuration, visit:
#   https://developer.salesforce.com/docs/platform/salesforce-code-analyzer/guide/config-custom.html
# ======================================================================
# Level at which to log messages to log files.
# Possible values are:
#   1 or 'Error' - Includes only error messages in the log.
#   2 or 'Warn' - Includes warning and error messages in the log.
#   3 or 'Info' - Includes informative, warning, and error messages in the log.
#   4 or 'Debug' - Includes debug, informative, warning, and error messages in the log.
#   5 or 'Fine' - Includes fine detail, debug, informative, warning, and error messages in the log.
# If unspecified, or if specified as null, then the 'Debug' log level will be used.
log_level: 4

engines:
  pmd:
    # Existing enforced PMD ruleset, which applies message/priority overrides
    # to a curated set of built-in Apex rules. Code Analyzer auto-tags every
    # rule declared in a custom ruleset with the ruleset's own `name` attribute
    # (spaces stripped) -- this file's <ruleset name="Enforced Apex Rules">
    # becomes the "EnforcedApexRules" tag, which the CI job's --rule-selector
    # targets directly (see code-analyzer-check in
    # .gitlab/workflows/test-quality-jobs.yml).
    custom_rulesets:
      - "./scripts/pmd/default_apex.xml"
  # Code Analyzer initializes every engine at startup regardless of
  # --rule-selector, and hard-fails if an engine's runtime dependency is
  # missing. pmd (Java) and flow (Python) are installed at runtime in
  # code-analyzer-check; the rest need dependencies this pipeline doesn't
  # install (eslint/retire-js need a real npm project, sfge is a heavy
  # 10-30min data-flow scan, apexguru needs an authenticated org), so
  # they're disabled to match the old PMD-only job's scope.
  cpd:
    disable_engine: true
  eslint:
    disable_engine: true
  retire-js:
    disable_engine: true
  sfge:
    disable_engine: true
  apexguru:
    disable_engine: true
