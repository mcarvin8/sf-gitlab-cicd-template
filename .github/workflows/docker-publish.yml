name: Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
  schedule:
    # Rebuild twice a month (~biweekly; cron has no native every-N-weeks
    # interval) so the image stays current on sf CLI and plugin versions
    # even when the Dockerfile itself doesn't change.
    - cron: "0 6 1,15 * *"
  workflow_dispatch: {}

env:
  IMAGE_NAME: mcarvin8/sf-cli

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:linux

