name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.windows
      - .dockerignore
  schedule:
    # Rebuild twice a month (~biweekly; cron has no native every-N-weeks
    # interval) so latest/windows tags stay current on sf CLI and plugin
    # versions even when the Dockerfiles themselves don't change.
    - cron: '0 6 1,15 * *'
  workflow_dispatch: {}

env:
  IMAGE_NAME: mcarvin8/sf-cli

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:linux

  windows:
    # windows-latest is Windows Server 2022, matching the ltsc2022 base image
    # in Dockerfile.windows, so process-isolation containers build natively.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

      # windows-latest's Docker Engine service can still be starting up when
      # this job begins, which fails the Build step with "failed to connect
      # to the docker API at npipe:////./pipe/docker_engine". Poll until it
      # responds instead of racing it.
      - name: Wait for Docker
        run: |
          $tries = 0
          while ($true) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { break }
            $tries++
            if ($tries -ge 30) { throw "Docker daemon did not become ready in time" }
            Start-Sleep -Seconds 2
          }

      - name: Build
        run: docker build -f Dockerfile.windows -t "${{ env.IMAGE_NAME }}:windows" -t "${{ env.IMAGE_NAME }}:windows-ltsc2022" .

      - name: Push
        run: |
          docker push "${{ env.IMAGE_NAME }}:windows"
          docker push "${{ env.IMAGE_NAME }}:windows-ltsc2022"
