name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.windows
      - .dockerignore
  workflow_dispatch: {}

env:
  IMAGE_NAME: mcarvin8/sf-cli

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:linux

  windows:
    # GitHub-hosted Windows runners only support Linux containers (via WSL2).
    # Building this Windows Server Core image requires a self-hosted Windows
    # runner with Docker configured for Windows containers.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

      - name: Build
        run: docker build -f Dockerfile.windows -t "${{ env.IMAGE_NAME }}:windows" -t "${{ env.IMAGE_NAME }}:windows-ltsc2022" .

      - name: Push
        run: |
          docker push "${{ env.IMAGE_NAME }}:windows"
          docker push "${{ env.IMAGE_NAME }}:windows-ltsc2022"
