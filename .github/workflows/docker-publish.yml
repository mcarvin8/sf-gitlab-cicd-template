name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.windows
      - .dockerignore
  schedule:
    # Rebuild weekly so latest/windows tags stay current on sf CLI and
    # plugin versions even when the Dockerfiles themselves don't change.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

env:
  IMAGE_NAME: mcarvin8/sf-cli

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:linux

  windows:
    # windows-latest is Windows Server 2022, matching the ltsc2022 base image
    # in Dockerfile.windows, so process-isolation containers build natively.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

      - name: Build
        run: docker build -f Dockerfile.windows -t "${{ env.IMAGE_NAME }}:windows" -t "${{ env.IMAGE_NAME }}:windows-ltsc2022" .

      - name: Push
        run: |
          docker push "${{ env.IMAGE_NAME }}:windows"
          docker push "${{ env.IMAGE_NAME }}:windows-ltsc2022"
